[package]
name = "emuhub"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui = "=0.2.2"
gpui-component = "=0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
gilrs = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 0
