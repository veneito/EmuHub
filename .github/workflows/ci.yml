name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: emuhub
          - os: macos-latest
            exe: emuhub
          - os: windows-latest
            exe: emuhub.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # GPUI draws with Vulkan/X11/Wayland on Linux; gilrs reads controllers through udev.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libudev-dev libasound2-dev libzstd-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

      - name: Build release
        if: runner.os != 'macOS'
        run: cargo build --release

      # One "universal" program that runs on both Apple Silicon and Intel Macs.
      - name: Build release (universal macOS)
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output target/release/emuhub \
            target/aarch64-apple-darwin/release/emuhub target/x86_64-apple-darwin/release/emuhub
          lipo -info target/release/emuhub

      - uses: actions/upload-artifact@v4
        with:
          name: emuhub-${{ runner.os }}
          path: target/release/${{ matrix.exe }}
