name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: emuhub
          - os: macos-latest
            exe: emuhub
          - os: windows-latest
            exe: emuhub.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # GPUI draws with Vulkan/X11/Wayland on Linux; gilrs reads controllers through udev.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libudev-dev libasound2-dev libzstd-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: emuhub-${{ runner.os }}
          path: target/release/${{ matrix.exe }}
