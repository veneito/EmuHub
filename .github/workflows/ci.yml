name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job below can write.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: emuhub
          - os: macos-latest
            exe: emuhub
          - os: windows-latest
            exe: emuhub.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # GPUI draws with Vulkan/X11/Wayland on Linux; gilrs reads controllers through udev.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libudev-dev libasound2-dev libzstd-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

      - name: Build release
        if: runner.os != 'macOS'
        run: cargo build --release

      # One "universal" program that runs on both Apple Silicon and Intel Macs.
      - name: Build release (universal macOS)
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output target/release/emuhub \
            target/aarch64-apple-darwin/release/emuhub target/x86_64-apple-darwin/release/emuhub
          lipo -info target/release/emuhub

      # EmuHub.app inside a drag-to-Applications .dmg. Signed ad hoc (free, not notarized),
      # so the first open needs right-click → Open.
      - name: Package EmuHub.dmg
        if: runner.os == 'macOS'
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys; print(json.load(sys.stdin)['packages'][0]['version'])")
          APP=dmg/EmuHub.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          # Dock and Finder icon, every size macOS asks for.
          mkdir emuhub.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/emuhub.png --out emuhub.iconset/icon_${s}x${s}.png
            sips -z $((s*2)) $((s*2)) assets/emuhub.png --out emuhub.iconset/icon_${s}x${s}@2x.png
          done
          iconutil -c icns emuhub.iconset -o "$APP/Contents/Resources/emuhub.icns"
          cp target/release/emuhub "$APP/Contents/MacOS/emuhub"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>EmuHub</string>
            <key>CFBundleDisplayName</key><string>EmuHub</string>
            <key>CFBundleIdentifier</key><string>dev.emuhub.app</string>
            <key>CFBundleExecutable</key><string>emuhub</string>
            <key>CFBundleIconFile</key><string>emuhub</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>10.15</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          codesign --force --deep --sign - "$APP"
          ln -s /Applications dmg/Applications
          hdiutil create -volname EmuHub -srcfolder dmg -ov -format UDZO EmuHub.dmg

      # One-file Linux app with icon and menu entry (what SteamOS/EmuDeck users expect).
      - name: Package AppImage
        if: runner.os == 'Linux'
        run: |
          mkdir -p AppDir/usr/bin
          cp target/release/emuhub AppDir/usr/bin/emuhub
          cp assets/emuhub.desktop assets/emuhub.png AppDir/
          ln -s usr/bin/emuhub AppDir/AppRun
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool AppDir EmuHub-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: emuhub-AppImage
          path: EmuHub-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: emuhub-${{ runner.os }}
          path: ${{ runner.os == 'macOS' && 'EmuHub.dmg' || format('target/release/{0}', matrix.exe) }}

  # Pushing a tag like v0.2.0 publishes a GitHub Release with all three builds.
  # EmuHub's update check reads the latest release's tag.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-notes.md
          path: repo
      - uses: actions/download-artifact@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv emuhub-Windows/emuhub.exe emuhub-windows.exe
          mv emuhub-macOS/EmuHub.dmg EmuHub.dmg
          mv emuhub-Linux/emuhub emuhub-linux
          mv emuhub-AppImage/EmuHub-x86_64.AppImage EmuHub-x86_64.AppImage
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "EmuHub ${GITHUB_REF_NAME#v}" --notes-file repo/.github/release-notes.md --generate-notes --latest             emuhub-windows.exe EmuHub.dmg EmuHub-x86_64.AppImage emuhub-linux
